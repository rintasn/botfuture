<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · Futures Command Center</title>
  <style>
    :root{color-scheme:dark;--bg:#070b12;--panel:#101722;--line:#243044;--gold:#f6c453;--muted:#8a98ad;--red:#ff647c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 10%,#15223b 0,transparent 36%),var(--bg);color:#eef3fa}
    .shell{width:min(420px,calc(100% - 32px));padding:34px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(20,30,45,.96),rgba(10,15,24,.98));box-shadow:0 30px 80px #0008}
    .mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#f6c45318;border:1px solid #f6c45355;color:var(--gold);font-weight:900;font-size:22px}
    h1{margin:20px 0 8px;font-size:26px}.sub{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:25px}
    label{display:block;color:#b8c3d3;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:15px 0 8px}
    input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#090f19;color:white;outline:none;font-size:15px}input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f6c45318}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:11px;background:linear-gradient(135deg,#f6c453,#df9f24);color:#181005;font-weight:800;font-size:14px;cursor:pointer}
    .alert{padding:11px 13px;border-radius:10px;margin:14px 0;background:#ff647c16;border:1px solid #ff647c55;color:#ff9aaa;font-size:13px}
    .foot{margin-top:20px;text-align:center;color:#5d6a7e;font-size:11px}
  </style>
</head>
<body>
  <main class="shell">
    <div class="mark">BF</div>
    <h1>Futures Command Center</h1>
    <p class="sub">Akses terlindungi untuk monitoring live bot dan pengaturan strategi.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" autocomplete="off">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Masuk ke dashboard</button>
    </form>
    <div class="foot">Session aman · maksimal 5 percobaan / 5 menit</div>
  </main>
</body>
</html>
